<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Apple SD Gothic Neo, sans-serif">
<rect width="960" height="460" fill="#fff"/>
<text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">map(): 0~1023 자를 0~180 자로 옮겨 잰다</text>
<circle cx="110" cy="150" r="55" fill="#e5e7eb" stroke="#333" stroke-width="4"/>
<line x1="110" y1="150" x2="110" y2="105" stroke="#333" stroke-width="6" stroke-linecap="round"/>
<text x="110" y="235" text-anchor="middle" font-size="17">가변저항</text>
<text x="110" y="258" text-anchor="middle" font-size="15" font-family="Menlo, monospace">analogRead(A0)</text>
<g transform="translate(230,110)">
<rect x="0" y="0" width="600" height="44" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
<text x="-10" y="-10" font-size="16" fill="#c2410c" font-weight="700">입력 (가변저항 값)</text>
<text x="0" y="30" font-size="18" text-anchor="start" dx="6">0</text><text x="300" y="30" font-size="18" text-anchor="middle">512</text><text x="594" y="30" font-size="18" text-anchor="end">1023</text>
<rect x="0" y="150" width="600" height="44" fill="#bfdbfe" stroke="#2f6fde" stroke-width="2"/>
<text x="-10" y="226" font-size="16" fill="#2f6fde" font-weight="700">출력 (서보 각도)</text>
<text x="0" y="180" font-size="18" dx="6">0°</text><text x="300" y="180" font-size="18" text-anchor="middle">90°</text><text x="594" y="180" font-size="18" text-anchor="end">180°</text>
<g stroke="#555" stroke-width="2" stroke-dasharray="6 5"><line x1="2" y1="44" x2="2" y2="150"/><line x1="300" y1="44" x2="300" y2="150"/><line x1="598" y1="44" x2="598" y2="150"/></g>
</g>
<text x="480" y="370" text-anchor="middle" font-size="20" font-family="Menlo, monospace">angle = map(value, 0, 1023, 0, 180);</text>
<text x="480" y="400" text-anchor="middle" font-size="17" fill="#555">map(변환할 값, 입력 최소, 입력 최대, 출력 최소, 출력 최대)</text>
<text x="480" y="435" text-anchor="middle" font-size="18" font-weight="700">손잡이를 반쯤 돌리면(512) → 서보도 반(90도) 돈다</text>
</svg>

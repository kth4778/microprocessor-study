<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Apple SD Gothic Neo, sans-serif">
<rect width="960" height="520" fill="#fff"/>
<text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">모터 드라이버(L293D): 아두이노는 명령만, 힘은 드라이버가</text>
<rect x="40" y="110" width="200" height="150" rx="14" fill="#1d6fa5"/>
<text x="140" y="175" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">아두이노</text>
<text x="140" y="205" text-anchor="middle" fill="#dbeafe" font-size="16">작은 전류만 낼 수 있음</text>
<text x="252" y="150" font-size="16" fill="#333">5번 핀</text>
<text x="252" y="248" font-size="16" fill="#333">6번 핀</text>
<line x1="240" y1="160" x2="400" y2="160" stroke="#7c3aed" stroke-width="5"/>
<line x1="240" y1="220" x2="400" y2="220" stroke="#16a34a" stroke-width="5"/>
<text x="320" y="190" text-anchor="middle" font-size="15" fill="#555">"이 방향으로 돌려!"</text>
<rect x="400" y="110" width="180" height="150" rx="10" fill="#222"/>
<text x="490" y="180" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">L293D</text>
<text x="490" y="210" text-anchor="middle" fill="#bbb" font-size="15">H-브리지가 들어 있는 칩</text>
<rect x="420" y="320" width="140" height="60" rx="8" fill="#f59e0b"/>
<text x="490" y="357" text-anchor="middle" font-size="18" font-weight="700">모터용 전원</text>
<line x1="490" y1="320" x2="490" y2="260" stroke="#f59e0b" stroke-width="6"/>
<line x1="580" y1="160" x2="740" y2="160" stroke="#dc2626" stroke-width="7"/>
<line x1="580" y1="220" x2="740" y2="220" stroke="#111" stroke-width="7"/>
<text x="660" y="190" text-anchor="middle" font-size="15" fill="#555">큰 전류</text>
<circle cx="810" cy="190" r="65" fill="#e5e7eb" stroke="#333" stroke-width="4"/>
<text x="810" y="200" text-anchor="middle" font-size="26" font-weight="700">DC 모터</text>
<path d="M140 270 Q 470 300 790 260" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
<text x="460" y="300" font-size="40" fill="#dc2626" font-weight="700">✕</text>
<text x="500" y="298" font-size="16" fill="#dc2626">직접 연결 금지: 모터 전류가 커서 아두이노가 망가질 수 있음</text>
<g transform="translate(150,400)" font-size="18">
<rect width="660" height="110" rx="10" fill="#f3f4f6"/>
<text x="20" y="32" font-weight="700">5번</text><text x="120" y="32" font-weight="700">6번</text><text x="230" y="32" font-weight="700">모터</text>
<text x="20" y="62">HIGH</text><text x="120" y="62">LOW</text><text x="230" y="62">정회전 ↻   (두 값이 다르면 돈다)</text>
<text x="20" y="90">LOW</text><text x="120" y="90">HIGH</text><text x="230" y="90">역회전 ↺   · LOW/LOW 또는 HIGH/HIGH → 정지 ■</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Apple SD Gothic Neo, sans-serif">
<rect width="960" height="470" fill="#fff"/>
<text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">모터 4종류 한눈에 비교</text>
<g font-size="16">
<g transform="translate(20,70)"><rect width="215" height="380" rx="14" fill="#dbeafe"/>
<text x="107" y="36" text-anchor="middle" font-size="22" font-weight="700">DC 모터</text>
<circle cx="107" cy="105" r="45" fill="#fff" stroke="#333" stroke-width="3"/><path d="M80 80 A38 38 0 1 1 72 120" fill="none" stroke="#2f6fde" stroke-width="5"/>
<text x="14" y="190" font-weight="700">계속 빙글빙글</text><text x="14" y="220">속도: PWM</text><text x="14" y="245">(analogWrite)</text><text x="14" y="275">방향: H-브리지</text><text x="14" y="300">(L293D)</text><text x="14" y="340">예: 선풍기, 바퀴</text></g>
<g transform="translate(255,70)"><rect width="215" height="380" rx="14" fill="#fde68a"/>
<text x="107" y="36" text-anchor="middle" font-size="22" font-weight="700">서보 모터</text>
<path d="M57 140 A50 50 0 0 1 157 140" fill="#fff" stroke="#333" stroke-width="3"/><line x1="107" y1="140" x2="140" y2="105" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
<text x="14" y="190" font-weight="700">정한 각도로 가서 멈춤</text><text x="14" y="220">0~180도</text><text x="14" y="250">각도 측정 장치 내장</text><text x="14" y="280">myservo.write(각도)</text><text x="14" y="340">예: 자동문, 로봇 관절</text></g>
<g transform="translate(490,70)"><rect width="215" height="380" rx="14" fill="#bbf7d0"/>
<text x="107" y="36" text-anchor="middle" font-size="22" font-weight="700">스테핑 모터</text>
<circle cx="107" cy="105" r="22" fill="#fff" stroke="#333" stroke-width="3"/>
<rect x="97" y="55" width="20" height="18" fill="#16a34a"/><rect x="139" y="95" width="18" height="20" fill="#9ca3af"/><rect x="97" y="137" width="20" height="18" fill="#9ca3af"/><rect x="57" y="95" width="18" height="20" fill="#9ca3af"/>
<text x="14" y="190" font-weight="700">한 칸씩 정확히</text><text x="14" y="220">회전각 = 펄스 수 × 1칸</text><text x="14" y="250">드라이버: ULN2003</text><text x="14" y="280">myStepper.step(칸수)</text><text x="14" y="340">예: 3D 프린터, CNC</text></g>
<g transform="translate(725,70)"><rect width="215" height="380" rx="14" fill="#fbcfe8"/>
<text x="107" y="36" text-anchor="middle" font-size="22" font-weight="700">BLDC 모터</text>
<circle cx="107" cy="105" r="45" fill="#fff" stroke="#333" stroke-width="3"/><path d="M107 82 A23 23 0 0 1 107 128" fill="#dc2626"/><path d="M107 82 A23 23 0 0 0 107 128" fill="#2f6fde"/>
<text x="14" y="190" font-weight="700">브러시 없음</text><text x="14" y="220">→ 오래가고 조용, 빠름</text><text x="14" y="250">코일 U·V·W 순서대로</text><text x="14" y="280">홀센서로 위치 파악</text><text x="14" y="340">예: 드론, 전기차, 쿨러</text></g>
</g>
</svg>
